<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="900" height="330" fill="#fff"/>
<text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold">Cadena de arranque en Ubuntu con Secure Boot</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker></defs>
<g font-size="13" text-anchor="middle" stroke="#333" stroke-width="1.5">
<rect x="20" y="70" width="120" height="70" rx="8" fill="#eee"/>
<rect x="170" y="70" width="120" height="70" rx="8" fill="#cfe3ff"/>
<rect x="320" y="70" width="120" height="70" rx="8" fill="#cfe3ff"/>
<rect x="470" y="70" width="120" height="70" rx="8" fill="#d8f0d0"/>
<rect x="620" y="70" width="120" height="70" rx="8" fill="#d8f0d0"/>
<rect x="770" y="70" width="110" height="70" rx="8" fill="#fde7c0"/>
<rect x="245" y="210" width="130" height="70" rx="8" fill="#d8f0d0"/>
<rect x="525" y="210" width="130" height="70" rx="8" fill="#fde7c0"/>
</g>
<g font-size="13" text-anchor="middle" fill="#111">
<text x="80" y="102">Encendido</text><text x="80" y="120">+ POST</text>
<text x="230" y="102">UEFI</text><text x="230" y="120">(firmware)</text>
<text x="380" y="102">shim</text><text x="380" y="120">(Microsoft)</text>
<text x="530" y="102">GRUB</text><text x="530" y="120">(Canonical)</text>
<text x="680" y="102">Kernel</text><text x="680" y="120">Linux</text>
<text x="825" y="102">initramfs</text><text x="825" y="120">(raíz)</text>
<text x="310" y="242">systemd</text><text x="310" y="260">servicios</text>
<text x="590" y="242">Login</text><text x="590" y="260">gráfico / terminal</text>
</g>
<g stroke="#333" stroke-width="2" fill="none" marker-end="url(#a)">
<line x1="140" y1="105" x2="168" y2="105"/><line x1="290" y1="105" x2="318" y2="105"/>
<line x1="440" y1="105" x2="468" y2="105"/><line x1="590" y1="105" x2="618" y2="105"/>
<line x1="740" y1="105" x2="768" y2="105"/>
<path d="M825 140 L825 175 L310 175 L310 208"/>
<line x1="375" y1="245" x2="523" y2="245"/>
</g>
<g font-size="11" fill="#555" text-anchor="middle">
<text x="230" y="160">valida shim</text><text x="380" y="160">valida GRUB</text><text x="530" y="160">valida kernel</text>
</g>
<text x="450" y="315" text-anchor="middle" font-size="11" fill="#555">UEFI lee BootOrder/Boot#### (NVRAM) y carga el .efi de la ESP</text>
</svg>

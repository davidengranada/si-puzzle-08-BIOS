<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="DejaVu Sans, Arial, sans-serif">
<rect width="900" height="360" fill="#fff"/>
<text x="450" y="28" text-anchor="middle" font-size="18" font-weight="bold">MBR frente a GPT</text>
<g font-size="14" font-weight="bold"><text x="20" y="70">MBR (BIOS)</text><text x="20" y="200">GPT (UEFI)</text></g>
<g stroke="#333" stroke-width="1.5" font-size="12" text-anchor="middle" fill="#111">
<rect x="20" y="85" width="190" height="60" fill="#fde7c0"/><text x="115" y="110">Sector 0: MBR</text><text x="115" y="128">código de arranque + 4 entradas</text>
<rect x="210" y="85" width="170" height="60" fill="#cfe3ff"/><text x="295" y="120">Partición primaria 1</text>
<rect x="380" y="85" width="170" height="60" fill="#cfe3ff"/><text x="465" y="120">Partición primaria 2</text>
<rect x="550" y="85" width="330" height="60" fill="#d8f0d0"/><text x="715" y="108">Partición extendida</text><text x="715" y="128">(particiones lógicas dentro)</text>
<rect x="20" y="215" width="120" height="60" fill="#eee"/><text x="80" y="240">MBR protector</text><text x="80" y="258">(compatibilidad)</text>
<rect x="140" y="215" width="120" height="60" fill="#fde7c0"/><text x="200" y="240">Cabecera GPT</text><text x="200" y="258">+ CRC</text>
<rect x="260" y="215" width="120" height="60" fill="#fde7c0"/><text x="320" y="240">Tabla de</text><text x="320" y="258">particiones</text>
<rect x="380" y="215" width="270" height="60" fill="#cfe3ff"/><text x="515" y="250">Particiones (ESP, datos, ...)</text>
<rect x="650" y="215" width="115" height="60" fill="#fde7c0"/><text x="707" y="240">Tabla</text><text x="707" y="258">(copia)</text>
<rect x="765" y="215" width="115" height="60" fill="#fde7c0"/><text x="822" y="240">Cabecera</text><text x="822" y="258">(copia)</text>
</g>
<g font-size="12" fill="#333">
<text x="20" y="168">· Direcciones de 32 bits · ~2 TiB (sectores de 512 B)</text>
<text x="20" y="188" fill="none"> </text>
<text x="20" y="300">· Direcciones de 64 bits · 128 entradas habituales</text>
<text x="20" y="320">· Cabeceras y tablas redundantes + CRC (detecta daños, no los repara por sí solo)</text>
</g>
</svg>
